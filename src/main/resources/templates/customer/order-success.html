<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success</title>
    <style>
        :root {
            /* Colorful Vivid Gradient Background */
            --bg-gradient: radial-gradient(circle at 10% 20%, #ff6b6b 0%, #70a1ff 50%, #2ed573 100%);
            
            /* Glassmorphism Card Colors */
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.6);
            
            /* High-Contrast Neon Accents */
            --accent-emerald: #10b981;
            --accent-blue: #0284c7;

            --text-main: #0f172a;
            --text-muted: #475569;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0; 
            padding: 40px 20px; 
            text-align: center;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .card { 
            background: var(--card-bg); 
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); 
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
        }

        .icon-wrapper {
            font-size: 56px;
            margin-bottom: 12px;
            line-height: 1;
        }

        h2 { 
            color: var(--accent-emerald); 
            font-size: 24px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .order-badge {
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            padding: 12px 18px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 24px;
        }

        .order-badge h3 {
            margin: 0;
            color: var(--accent-blue);
            font-size: 18px;
            font-weight: 700;
        }

        .btn { 
            background: linear-gradient(135deg, #0284c7, #2563eb); 
            color: white; 
            border: none; 
            padding: 14px 28px; 
            border-radius: 12px; 
            text-decoration: none; 
            display: inline-block; 
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:hover {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="icon-wrapper">🎉</div>
        <h2>Order Placed Successfully!</h2>
        <p>Your order has been placed successfully.</p>
        
        <div class="order-badge">
            <h3 id="orderIdDisplay">Order #ORD1001</h3>
        </div>

        <div>
            <a href="orders.html" class="btn">View My Orders</a>
        </div>
    </div>
</div>

<script>
    const latest = JSON.parse(localStorage.getItem('latestOrder'));
    if (latest) {
        document.getElementById('orderIdDisplay').innerText = "Order " + latest.id;
    }
</script>

</body>
</html>
