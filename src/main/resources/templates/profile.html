<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prime Nutrition & Checkout</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .badge { background: #e8f5e9; color: #2e7d32; padding: 4px 8px; border-radius: 6px; font-weight: bold; }
        .btn-qty { width: 30px; height: 30px; border: none; background: #007bff; color: white; border-radius: 50%; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .btn-qty:active { transform: scale(0.9); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; text-align: center; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <!-- 1. Nutrition Requirement Section -->
    <div class="card">
        <h2>💪 Prime Nutrition</h2>
        <label>Set Target Protein (grams): </label>
        <input type="number" id="proteinInput" value="50" style="padding: 5px; width: 80px;">
        <button onclick="saveNutrition()" style="padding: 6px 12px; background: #28a745; color: white; border: none; border-radius: 4px;">Save Requirement</button>
    </div>

    <!-- 2. Recommendations Section -->
    <div class="card">
        <h2>🥗 Recommendations</h2>
        <div id="recommendationList">Click "View Recommendations" to load suggestions.</div>
        <button onclick="loadRecommendations()" style="margin-top: 10px;">View Recommendations</button>
    </div>

    <!-- 3. Cart & Quantity Management -->
    <div class="card">
        <h2>🛒 Cart Management</h2>
        <div id="cartItems"></div>
        <hr>
        <p>Subtotal: ₹<span id="subtotal">0</span></p>
        <p>Prime Discount (10%): -₹<span id="discount">0</span></p>
        <h3>Final Total: ₹<span id="finalTotal">0</span></h3>
        <button onclick="placeOrder()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; width: 100%;">Place Order</button>
    </div>

    <!-- 4. Success Popup Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <h2 style="color: #28a745;">🎉 Order Placed Successfully!</h2>
            <p>Your order has been placed successfully.</p>
            <h3 id="modalOrderId">Order ID: #ORD1025</h3>
            <button onclick="closeModal()" style="padding: 8px 16px; background: #333; color: white; border: none; border-radius: 4px;">Close</button>
        </div>
    </div>

    <script>
        let cart = [
            { id: 1, name: 'Grilled Chicken', price: 250, qty: 1, protein: 35 },
            { id: 2, name: 'Protein Bowl', price: 300, qty: 1, protein: 42 }
        ];

        function renderCart() {
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                subtotal += itemTotal;
                container.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <div>
                            <strong>${item.name}</strong> <span class="badge">${item.protein}g Protein</span><br>
                            Price: ₹${item.price}
                        </div>
                        <div>
                            <button class="btn-qty" onclick="updateQty(${index}, -1)">-</button>
                            <span style="margin: 0 10px; font-weight:bold;">${item.qty}</span>
                            <button class="btn-qty" onclick="updateQty(${index}, 1)">+</button>
                            <button onclick="removeItem(${index})" style="margin-left:15px; background:red; color:white; border:none; padding:4px 8px; border-radius:4px;">Remove</button>
                        </div>
                    </div>`;
            });

            let discount = subtotal * 0.10; // 10% Prime Discount
            let finalTotal = subtotal - discount;

            document.getElementById('subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('discount').innerText = discount.toFixed(2);
            document.getElementById('finalTotal').innerText = finalTotal.toFixed(2);
        }

        function updateQty(index, change) {
            if (cart[index].qty + change > 0) {
                cart[index].qty += change;
            } else {
                cart.splice(index, 1);
            }
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function placeOrder() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            const orderId = "#ORD" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('modalOrderId').innerText = "Order ID: " + orderId;
            document.getElementById('successModal').style.display = 'flex';
            cart = [];
            renderCart();
        }

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
        }

        renderCart();
    </script>
</body>
</html>
