<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${food.id == null ? 'Add Food' : 'Edit Food'}">
        Add Food
    </title>

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
	<link rel="stylesheet" th:href="@{/css/add-food.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>Food Admin</h2>

        <ul>

            <li>
                <a th:href="@{/admin/dashboard}">
                    <i class="fa fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a th:href="@{/admin/foods}">
                    <i class="fa fa-utensils"></i>
                    Food Items
                </a>
            </li>

            <li class="logout-item">
                <a th:href="@{/logout}">
                    <i class="fa fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>


    <!-- Main Content -->
    <main class="content">

        <!-- Topbar -->
        <header class="topbar">

            <div>

                <h2 th:text="${food.id == null ? 'Add New Food' : 'Edit Food'}">
                    Add New Food
                </h2>

                <p>
                    Manage food details and nutritional information
                </p>

            </div>

            <div class="welcome">
                Welcome,
                <strong th:text="${session.username}">
                    Admin
                </strong>
            </div>

        </header>


        <!-- Form Container -->
        <section class="food-form-container">

            <div class="form-header">

                <div class="form-icon">
                    <i class="fa fa-utensils"></i>
                </div>

                <div>

                    <h2 th:text="${food.id == null ? 'Add Food Item' : 'Update Food Item'}">
                        Add Food Item
                    </h2>

                    <p>
                        Enter all important details about the food item.
                    </p>

                </div>

            </div>


            <form th:action="@{/admin/foods/save}"
                  th:object="${food}"
                  method="post">


                <!-- Hidden ID for Edit -->
                <input type="hidden"
                       th:field="*{id}">


                <!-- Basic Information -->
                <div class="form-section">

                    <h3>
                        <i class="fa fa-circle-info"></i>
                        Basic Information
                    </h3>


                    <div class="form-grid">

                        <!-- Food Name -->
                        <div class="form-group">

                            <label for="name">
                                Food Name
                            </label>

                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   placeholder="Enter food name"
                                   required>

                        </div>


                        <!-- Category -->
                        <div class="form-group">

                            <label for="category">
                                Category
                            </label>

                            <input type="text"
                                   id="category"
                                   th:field="*{category}"
                                   placeholder="e.g. Pizza, Burger, Pasta"
                                   required>

                        </div>


                        <!-- Price -->
                        <div class="form-group">

                            <label for="price">
                                Price (₹)
                            </label>

                            <input type="number"
                                   id="price"
                                   th:field="*{price}"
                                   placeholder="Enter price"
                                   step="0.01"
                                   min="0"
                                   required>

                        </div>


                        <!-- Image URL -->
                        <div class="form-group">

                            <label for="imageUrl">
                                Image URL
                            </label>

                            <input type="text"
                                   id="imageUrl"
                                   th:field="*{imageUrl}"
                                   placeholder="Enter food image URL">

                        </div>


                        <!-- Description -->
                        <div class="form-group full-width">

                            <label for="description">
                                Description
                            </label>

                            <textarea id="description"
                                      th:field="*{description}"
                                      placeholder="Enter food description"
                                      rows="4">
                            </textarea>

                        </div>

                    </div>

                </div>


                <!-- Nutrition -->
                <div class="form-section">

                    <h3>
                        <i class="fa fa-heart-pulse"></i>
                        Nutrition Information
                    </h3>


                    <div class="nutrition-form-grid">

                        <!-- Calories -->
                        <div class="form-group">

                            <label for="calories">
                                Calories (kcal)
                            </label>

                            <input type="number"
                                   id="calories"
                                   th:field="*{calories}"
                                   placeholder="0"
                                   step="0.01"
                                   min="0">

                        </div>


                        <!-- Protein -->
                        <div class="form-group">

                            <label for="protein">
                                Protein (g)
                            </label>

                            <input type="number"
                                   id="protein"
                                   th:field="*{protein}"
                                   placeholder="0"
                                   step="0.01"
                                   min="0">

                        </div>


                        <!-- Carbohydrates -->
                        <div class="form-group">

                            <label for="carbohydrates">
                                Carbohydrates (g)
                            </label>

                            <input type="number"
                                   id="carbohydrates"
                                   th:field="*{carbohydrates}"
                                   placeholder="0"
                                   step="0.01"
                                   min="0">

                        </div>


                        <!-- Fats -->
                        <div class="form-group">

                            <label for="fats">
                                Fats (g)
                            </label>

                            <input type="number"
                                   id="fats"
                                   th:field="*{fats}"
                                   placeholder="0"
                                   step="0.01"
                                   min="0">

                        </div>


                        <!-- Fiber -->
                        <div class="form-group">

                            <label for="fiber">
                                Fiber (g)
                            </label>

                            <input type="number"
                                   id="fiber"
                                   th:field="*{fiber}"
                                   placeholder="0"
                                   step="0.01"
                                   min="0">

                        </div>


                        <!-- Magnesium -->
                        <div class="form-group">

                            <label for="magnesium">
                                Magnesium (mg)
                            </label>

                            <input type="number"
                                   id="magnesium"
                                   th:field="*{magnesium}"
                                   placeholder="0"
                                   step="0.01"
                                   min="0">

                        </div>

                    </div>

                </div>


                <!-- Availability -->

				<div class="form-section availability-section">
				
				    <h3>
				        <i class="fa fa-circle-check"></i>
				        Food Availability
				    </h3>
				
				    <label class="availability-checkbox">
				
				        <input type="checkbox"
				               th:field="*{available}">
				
				        <span>Food is currently available</span>
				
				    </label>
				
				</div>


                <!-- Buttons -->
                <div class="form-actions">

                    <a th:href="@{/admin/foods}"
                       class="cancel-btn">

                        <i class="fa fa-arrow-left"></i>
                        Cancel

                    </a>


                    <button type="submit"
                            class="save-food-btn">

                        <i class="fa fa-save"></i>

                        <span th:text="${food.id == null ? 'Save Food' : 'Update Food'}">
                            Save Food
                        </span>

                    </button>

                </div>


            </form>

        </section>

    </main>

</div>

</body>
</html>
