<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Management - Food Bridge</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/css/admin.css">

	<link rel="stylesheet" href="/css/admin/food-list.css">

</head>

<body>

<div class="admin-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-utensils"></i>
            <span>Food Bridge</span>
        </div>

        <nav class="navigation">

            <a href="/admin/dashboard" class="nav-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>

            <a href="/admin/foods" class="nav-item active">
                <i class="fa-solid fa-burger"></i>
                <span>Food Management</span>
            </a>

            <a href="/admin/foods/add" class="nav-item">
                <i class="fa-solid fa-circle-plus"></i>
                <span>Add Food</span>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="/admin/dashboard" class="nav-item">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Dashboard</span>
            </a>

        </div>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <div class="food-page-header">

            <div>
                <h1>Food Management</h1>
                <p>Manage all food items from one place</p>
            </div>

            <a href="/admin/foods/add" class="primary-btn">
                <i class="fa-solid fa-plus"></i>
                Add Food
            </a>

        </div>


        <!-- Food Table -->
        <div class="table-container">

            <div id="loading" class="loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                Loading foods...
            </div>

            <table class="food-table" id="foodTable">

                <thead>
                    <tr>
                        <th>Food</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Calories</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="foodTableBody"></tbody>

            </table>


            <div id="emptyState" class="empty-state">

                <i class="fa-solid fa-burger"></i>

                <h2>No Foods Found</h2>

                <p>Add your first food item to get started.</p>

                <br>

                <a href="/admin/foods/add" class="primary-btn">
                    <i class="fa-solid fa-plus"></i>
                    Add Food
                </a>

            </div>

        </div>

    </main>

</div>


<script>

    async function loadFoods() {

        const loading = document.getElementById("loading");
        const table = document.getElementById("foodTable");
        const emptyState = document.getElementById("emptyState");
        const tableBody = document.getElementById("foodTableBody");

        try {

            const response = await fetch("/api/admin/foods");

            if (!response.ok) {
                throw new Error("Failed to load foods");
            }

            const foods = await response.json();

            loading.style.display = "none";

            if (foods.length === 0) {

                emptyState.style.display = "block";
                return;
            }

            table.style.display = "table";

            tableBody.innerHTML = "";

            foods.forEach(food => {

                const row = document.createElement("tr");

                row.innerHTML = `

                    <td>
                        <div class="food-info">

                            <img
                                src="${food.imageUrl || 'https://via.placeholder.com/55'}"
                                class="food-image"
                                alt="${food.name}"
                            >

                            <div>
                                <div class="food-name">
                                    ${food.name}
                                </div>

                                <div class="food-description">
                                    ${food.description || "No description"}
                                </div>
                            </div>

                        </div>
                    </td>

                    <td>
                        <span class="category-badge">
                            ${food.category || "Other"}
                        </span>
                    </td>

                    <td>
                        <span class="price">
                            ₹${food.price}
                        </span>
                    </td>

                    <td>
                        ${food.calories || 0} kcal
                    </td>

                    <td>
                        ${
                            food.avaliable
                            ?
                            '<span class="status available"><i class="fa-solid fa-circle-check"></i> Available</span>'
                            :
                            '<span class="status unavailable"><i class="fa-solid fa-circle-xmark"></i> Unavailable</span>'
                        }
                    </td>

                    <td>

                        <div class="action-buttons">

                            <button
                                class="icon-btn view-btn"
                                title="View"
                                onclick="viewFood(${food.id})">

                                <i class="fa-solid fa-eye"></i>

                            </button>


                            <button
                                class="icon-btn edit-btn"
                                title="Edit"
                                onclick="editFood(${food.id})">

                                <i class="fa-solid fa-pen"></i>

                            </button>


                            <button
                                class="icon-btn availability-btn"
                                title="Change Availability"
                                onclick="toggleAvailability(${food.id}, ${food.avaliable})">

                                <i class="fa-solid fa-power-off"></i>

                            </button>


                            <button
                                class="icon-btn delete-btn"
                                title="Delete"
                                onclick="deleteFood(${food.id})">

                                <i class="fa-solid fa-trash"></i>

                            </button>

                        </div>

                    </td>

                `;

                tableBody.appendChild(row);

            });

        } catch (error) {

            loading.innerHTML =
                "<p>Unable to load foods. Please check the server.</p>";

            console.error(error);
        }
    }


    function viewFood(id) {

        window.location.href = "/admin/foods/view?id=" + id;

    }


    function editFood(id) {

        window.location.href = "/admin/foods/edit?id=" + id;

    }


    async function toggleAvailability(id, currentStatus) {

        const newStatus = !currentStatus;

        try {

            const response = await fetch(
                `/api/admin/foods/${id}/availability?available=${newStatus}`,
                {
                    method: "PUT"
                }
            );

            if (!response.ok) {
                throw new Error("Availability update failed");
            }

            alert(
                newStatus
                ? "Food is now Available"
                : "Food is now Unavailable"
            );

            loadFoods();

        } catch (error) {

            alert("Unable to update availability");

            console.error(error);
        }
    }


    async function deleteFood(id) {

        const confirmed =
            confirm("Are you sure you want to delete this food?");

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetch(
                `/api/admin/foods/${id}`,
                {
                    method: "DELETE"
                }
            );

            if (!response.ok) {
                throw new Error("Delete failed");
            }

            alert("Food deleted successfully");

            loadFoods();

        } catch (error) {

            alert("Unable to delete food");

            console.error(error);
        }
    }


    loadFoods();

</script>

</body>
</html>
