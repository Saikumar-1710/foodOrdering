<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Food Customizations</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

    <h1>
        Food Customizations
    </h1>

    <h2>

        Food:

        <span
                th:text="${food.name}">
        </span>

    </h2>

    <h3>

        Total Customizations:

        <span
                th:text="${totalCustomizations}">
    </span>

    </h3>

    <a
            th:href="@{/admin/customizations/add/{id}(id=${food.id})}">

        Add Customization

    </a>

    <hr>


    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Type</th>

            <th>Price</th>

            <th>Calories</th>

            <th>Protein</th>

            <th>Carbs</th>

            <th>Fats</th>

            <th>Fiber</th>

            <th>Magnesium</th>

            <th>Available</th>

            <th>Stock</th>

            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr
                th:each="option : ${options}">

            <td
                    th:text="${option.id}">
            </td>

            <td
                    th:text="${option.name}">
            </td>

            <td
                    th:text="${option.type}">
            </td>

            <td>

                ₹

                <span
                        th:text="${option.priceAdjustment}">
                </span>

            </td>

            <td
                    th:text="${option.calories}">
            </td>

            <td
                    th:text="${option.protein}">
            </td>

            <td
                    th:text="${option.carbohydrates}">
            </td>

            <td
                    th:text="${option.fats}">
            </td>

            <td
                    th:text="${option.fiber}">
            </td>

            <td
                    th:text="${option.magnesium}">
            </td>

            <td
                    th:text="${option.available}">
            </td>

            <td>

                <form
                        th:action="@{/admin/customizations/decrease-stock/{id}(id=${option.id})}"
                        method="post"
                        style="display:inline;">

                    <button type="submit">
                        −
                    </button>

                </form>

                <span
                        th:text="${option.stock}">
    </span>

                <form
                        th:action="@{/admin/customizations/increase-stock/{id}(id=${option.id})}"
                        method="post"
                        style="display:inline;">

                    <button type="submit">
                        +
                    </button>

                </form>

            </td>

            <td>

                <a
                        th:href="@{/admin/customizations/edit/{id}(id=${option.id})}">

                    Edit

                </a>

                &nbsp;

                <form
                        th:action="@{/admin/customizations/delete/{id}(id=${option.id})}"
                        method="post"
                        style="display:inline;">

                    <button
                            type="submit"
                            onclick="return confirm('Are you sure you want to delete this customization?');">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

    <br>

    <a href="/admin/foods">

        Back to Food Management

    </a>

</div>

</body>

</html>
