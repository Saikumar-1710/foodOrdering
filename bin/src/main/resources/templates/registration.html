<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodieGo - Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
}

.container{
    position:relative;
    z-index:2;
    width:430px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.3);
    border-radius:20px;
    padding:35px;
    color:#fff;
    box-shadow:0 15px 35px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:60px;
}

h2{
    text-align:center;
    margin-top:10px;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    font-size:14px;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:16px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,.2);
    color:#fff;
    font-size:15px;
}

.input-box input::placeholder{
    color:#eee;
}

.gender{
    display:flex;
    justify-content:space-around;
    margin:15px 0;
    font-size:15px;
}

.gender label{
    cursor:pointer;
}

.terms{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    margin-bottom:20px;
}

.terms a{
    color:#FFD700;
    text-decoration:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#ff6b00,#ffb400);
    color:#fff;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.03);
}

.success-message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:rgba(34,160,107,.2);
    color:#dff8ea;
    text-align:center;
    font-size:14px;
    border:1px solid rgba(255,255,255,.2);
}

.login-link{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.login-link a{
    color:#FFD700;
    text-decoration:none;
    font-weight:600;
}

.login-link a:hover{
    text-decoration:underline;
}

@media(max-width:500px){

.container{
    width:90%;
    padding:25px;
}

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="container">

<div class="logo">🍕</div>

<h2>Create Account</h2>

<p class="subtitle">Join FoodieGo and enjoy delicious meals!</p>

<form>

<div class="input-box">
<input type="text" placeholder="Full Name" required>
</div>

<div class="input-box">
<input type="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<input type="tel" placeholder="Mobile Number" required>
</div>

<div class="input-box">
<input type="password" placeholder="Create Password" required>
</div>

<div class="input-box">
<input type="password" placeholder="Confirm Password" required>
</div>

<div class="gender">
<label><input type="radio" name="gender"> Male</label>
<label><input type="radio" name="gender"> Female</label>
<label><input type="radio" name="gender"> Other</label>
</div>

<div class="terms">
<input type="checkbox" required>
<span>I agree to the <a href="#">Terms & Conditions</a></span>
</div>

<button type="submit">Create Account</button>

<div id="successMessage" class="success-message"></div>

<div class="login-link">
Already have an account?
<a href="login page.html">Login</a>
</div>

</form>

</div>

<script>
const regForm = document.querySelector('form');
const successMessage = document.getElementById('successMessage');

if (regForm && successMessage) {
  regForm.addEventListener('submit', function (e) {
    e.preventDefault();
    successMessage.textContent = 'Account created successfully! Please login to continue.';
    successMessage.style.display = 'block';
    setTimeout(function () {
      window.location.href = './login%20page.html';
    }, 1800);
  });
}
</script>

</body>
</html>
